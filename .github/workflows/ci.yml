name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # `uv sync` resolves from pyproject.toml (and uv.lock if committed). Add
      # `--frozen` once uv.lock is committed to enforce the lockfile.
      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Compile all
        run: uv run python -m compileall -q backtest.py backtest_robustness.py wfo_optimizer.py composer.py data.py agent.py server.py constants.py web tests

      - name: Pytest
        run: uv run pytest -q tests

      # DeepR 2026-08-08 [YÜKSEK]: the one real end-to-end chain test
      # (POST /backtest/run → progress poll → result render) is excluded from
      # the default run above (`addopts = -m "not e2e"`, pyproject.toml) since
      # it hits real Bybit network and takes ~2 min — but that meant it never
      # ran ANYWHERE, so a break in the chain (run_id parsing, the HTMX poll
      # fragment, verdict-badge rendering) went undetected.
      #
      # DeepR 2026-08-09 [YÜKSEK] follow-up: the original fix used
      # `continue-on-error: true` so a Bybit network hiccup could never block
      # the pipeline — but that also meant a REAL regression only turned the
      # step red without ever blocking the PR, i.e. the same silent-merge risk
      # the fix was meant to close. Retrying absorbs a transient network blip
      # (passes on attempt 2/3) while a reproducible failure (a real
      # regression) still fails all 3 attempts and blocks the PR for real.
      - name: Pytest (e2e — live Bybit, retried for network flakiness)
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            uv run pytest -q -m e2e tests
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "e2e attempt $i/$attempts failed (exit $LASTEXITCODE)"
          }
          exit $LASTEXITCODE
