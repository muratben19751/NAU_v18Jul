name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # DeepR 2026-08-11 [YÜKSEK]: plain `uv sync` RE-RESOLVED dependencies on
      # every run and recorded nothing, so a single upstream release could turn
      # main red without a line of code changing — and yesterday's green commit
      # could not be reproduced today. Worse for a backtest lab: Sharpe/drawdown
      # reproducibility (regression_baseline.json) depends on the pandas/numpy
      # version, and that version was pinned nowhere.
      #
      # `--locked` installs EXACTLY what uv.lock says AND fails if the lockfile
      # has drifted from pyproject.toml — so adding a dependency without
      # re-running `uv lock` is caught here, loudly, instead of silently
      # resolving to whatever is newest. (`--frozen` would also skip
      # re-resolution but accepts a stale lock; the two flags are mutually
      # exclusive and `--locked` is the strict one.)
      - name: Sync dependencies (from the committed lockfile)
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Compile all
        run: uv run python -m compileall -q backtest.py backtest_robustness.py wfo_optimizer.py composer.py data.py agent.py server.py constants.py web tests

      # `-ra` (also in pyproject's addopts) prints the REASON for every skip.
      # DeepR 2026-08-11 [YÜKSEK]: a skipped test used to be a bare number in
      # the summary line, so an environment-dependent skip of a critical path
      # was indistinguishable from a genuinely green suite. `--junitxml` feeds
      # the "Skipped tests" step below, which writes the same information into
      # the GitHub job summary — visible without opening the log.
      # `--cov` eklendi: eşik ve omit listesi pyproject'te, komut satırında değil
      # — yerel `pytest --cov` de AYNI kapıyı görsün ("CI'da kırmızı, bende
      # yeşil" olmasın). Kapı ölçümden kondu: 2026-08-17'de tam süit uygulama
      # kodunda %79 kapsıyordu, `fail_under` 75.
      - name: Pytest (+ coverage gate)
        run: uv run pytest -q -ra --junitxml=pytest-report.xml --cov=. --cov-report=term:skip-covered --cov-fail-under=75 tests

      # The full POST /backtest/run → progress poll → result render chain now
      # runs in the step above too: TestBacktestChainOffline drives the real
      # route/worker/sandbox/Nautilus engine with a synthetic bar frame, so a
      # break in the chain fails CI even without network. The step below is
      # the LIVE-data twin of the same chain.
      #
      # DeepR 2026-08-08 [YÜKSEK]: the one real end-to-end chain test is
      # excluded from the default run above (`addopts = -m "not e2e"`,
      # pyproject.toml) since it hits real Bybit network and takes ~2 min —
      # but that meant it never ran ANYWHERE, so a break in the chain (run_id
      # parsing, the HTMX poll fragment, verdict-badge rendering) went
      # undetected.
      #
      # DeepR 2026-08-09 [YÜKSEK] follow-up: the original fix used
      # `continue-on-error: true` so a Bybit network hiccup could never block
      # the pipeline — but that also meant a REAL regression only turned the
      # step red without ever blocking the PR, i.e. the same silent-merge risk
      # the fix was meant to close. Retrying absorbs a transient network blip
      # (passes on attempt 2/3) while a reproducible failure (a real
      # regression) still fails all 3 attempts and blocks the PR for real.
      #
      # DeepR 2026-08-11 [YÜKSEK] follow-up: the retry loop also accepted a run
      # that COLLECTED NOTHING (the spec_id fixture skipped when the runner had
      # no ~/.cache catalog) as success — "green because it never ran". The
      # fixture now seeds its own tmp catalog, and the "N passed" check below
      # turns an exit-0-but-nothing-ran run into a hard error instead of a
      # silent pass.
      - name: Pytest (e2e — live Bybit, retried for network flakiness)
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            $out = uv run pytest -m e2e -ra --tb=short tests 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -eq 0) {
              if ($out -match '(\d+) passed') {
                Write-Host "e2e: $($Matches[1]) test(s) actually passed."
                exit 0
              }
              Write-Host "::error::e2e step exited 0 but NO test passed - the live chain was never exercised."
              exit 1
            }
            Write-Host "e2e attempt $i/$attempts failed (exit $LASTEXITCODE)"
          }
          exit $LASTEXITCODE

      # DeepR 2026-08-11 [ORTA]: uygulamanın en kırılgan mantığının bir kısmı
      # şablonlara gömülü inline JS'te yaşıyor (sihirbaz adım kilitleri, mod
      # geçişi, canlı DOM düğümlerinin taşınması, mcSyncRange). `TestClient`
      # HTML'i alır ama JS'i ÇALIŞTIRMAZ, yani o kod tamamen korumasızdı —
      # bu turda bulunan UX hatalarının çoğu tam olarak orada oturuyordu.
      #
      # Süit gerçek Chromium açar, bu yüzden varsayılan koşumda `browser`
      # işaretiyle DESELECT edilir; burada, kendi adımında koşar. Tarayıcı
      # ikilisi eksikse süit ATLAMAZ, hata verir — "koştum ve geçti" ile "hiç
      # koşmadı" ayırt edilebilsin (canlı-Bybit adımının aynı dersi).
      - name: Install Chromium for the browser E2E
        run: uv run playwright install --with-deps chromium

      - name: Pytest (browser E2E — real Chromium)
        shell: pwsh
        run: |
          $out = uv run pytest -m browser -ra --tb=short tests 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -match '(\d+) passed') {
            Write-Host "browser: $($Matches[1]) test(s) actually passed."
            exit 0
          }
          Write-Host "::error::browser step exited 0 but NO test passed - the inline JS was never exercised."
          exit 1

      # Skipped tests are a finding, not noise: surface them in the job summary
      # so "which critical path went untested on this runner" is answerable
      # without scrolling the log (DeepR 2026-08-11 [YÜKSEK]).
      - name: Report skipped tests
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path pytest-report.xml)) {
            Write-Host "no pytest-report.xml - the pytest step did not produce one"
            exit 0
          }
          [xml]$r = Get-Content pytest-report.xml
          $suite = $r.testsuites.testsuite
          $n = [int]$suite.skipped
          $lines = @("## Pytest skips: $n")
          if ($n -gt 0) {
            $lines += ""
            $lines += "| Test | Reason |"
            $lines += "| --- | --- |"
            foreach ($tc in $suite.testcase) {
              if ($tc.skipped) {
                $why = ($tc.skipped.message -replace '\|', '/' -replace '\r?\n', ' ')
                $lines += "| ``$($tc.classname).$($tc.name)`` | $why |"
              }
            }
            Write-Host "::warning::$n test(s) were SKIPPED - see the job summary for reasons."
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $lines | ForEach-Object { Write-Host $_ }

  # ───────────────────────────────────────────────────────────────────────────
  # İkinci işletim sistemi. Tek OS'ta koşmak bu depoda somut bir boşluktu:
  # `sandbox._install_memory_ceiling`'in POSIX dalı (RLIMIT_AS) ve `os.fork`
  # varsayan her yol, Windows runner'da HİÇ çalışmıyordu — yazıldı, test edildi
  # (davranış olarak değil, sözleşme olarak) ve gerçek bir çekirdekte hiç
  # denenmedi.
  #
  # Kapsam bilinçli olarak DAR: lint + varsayılan süit. Canlı Bybit e2e'si,
  # Chromium adımı ve coverage kapısı Windows ayağında kalıyor — üçünü iki kez
  # koşmak süreyi ikiye katlar ve ikinci koşum yeni bir şey söylemez.
  #
  # NOT: bu ayağın İLK koşumu Windows'a özgü varsayımları ortaya çıkarabilir
  # (yol ayracı, dosya kilidi, pythonw). Kırmızı yanarsa bulgunun kendisi
  # görünmüş demektir; bulguyu gizlemek için `continue-on-error` KOYULMADI —
  # bu deponun CI yorumları tam olarak o deseni "sessizce merge" diye eleştiriyor.
  # ───────────────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (from the committed lockfile)
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest (default suite)
        run: uv run pytest -q -ra --no-cov tests
