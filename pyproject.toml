# Bir build backend'i ADI GEÇMEZSE pip/uv, setuptools'un eski (legacy) yoluna
# düşer: hangi setuptools sürümüyle, hangi otomatik-keşif kurallarıyla
# kurulduğu makineye göre değişir. PEP 517 backend'ini burada sabitlemek
# kurulumu makineden bağımsız hâle getirir (DeepR 2026-08-11 [YÜKSEK]).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Bu depo bir KÜTÜPHANE değil, bir uygulama: modüller kök dizinden
# (`python server.py`, `pytest tests`) çalıştırılır, site-packages'a
# kopyalanmaz. py-modules'ı boş bırakmak setuptools'un düz yerleşimde
# "Multiple top-level modules discovered" ile durmasını engeller; proje
# kurulumu yalnızca BAĞIMLILIKLARI getirir.
[tool.setuptools]
py-modules = []

[project]
name = "nautilus-web-app"
version = "0.1.0"
description = "FastAPI + HTMX research lab for composing and backtesting Bybit strategies on nautilus_trader."
requires-python = ">=3.12,<3.13"
dependencies = [
    # The only supported NautilusTrader version. Must match
    # constants.NAUTILUS_REQUIRED; server.py fails fast if the installed wheel
    # drifts.
    "nautilus_trader==1.230.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    # `data.py` bunu MODÜL SEVİYESİNDE import eder (Bybit REST istemcisi), yani
    # `server`/`data`/`stitch_ticker` import zincirindeki her şey buna bağlı.
    # Beyan edilmediği için `uv sync --locked` onu kurmuyordu ve süit
    # TOPLANAMADAN ölüyordu (40 collection error) — kurulu geldiği makinelerde
    # transitif olarak gelmesi bu boşluğu gizlemişti.
    "requests>=2.32",
    "ddgs>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Tarayıcı E2E'si (`pytest -m browser`). Paket tarayıcı İKİLİSİNİ getirmez;
    # `playwright install chromium` ayrı bir adım (CI'da da öyle).
    "playwright>=1.49",
]
# Only needed for the retired Streamlit UI under legacy/ (not the FastAPI app).
legacy = [
    "streamlit>=1.36",
    "yfinance>=0.2.40",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "legacy",
    "design2",
    "design_handoff_nautilus_lab",
    "nautilus_wiki",
    "__pycache__",
    # Vendored Claude Code skill assets, not product code: they ship with their
    # own style and are overwritten when a skill updates, so linting them only
    # ever breaks `ruff check .` (the command CI runs) for changes nobody made.
    ".claude",
    # Not product code (LLM fine-tuning trainer cache, unrelated to this app) —
    # 2502 of 2529 `ruff check .` errors on this repo came from here, drowning
    # any real signal from the other ~137 tracked .py files.
    "unsloth_compiled_cache",
    # Scratch/debug scripts (manual browser-driven E2E probes, one-off fix
    # scripts) — not linted, not part of the app.
    "debug",
    # pytest çalışma dizini: içindeki .py'ler LLM'in ÜRETTİĞİ blok kodlarıdır
    # (agnt_e_*/agnt_x_*), testler koştukça yeniden yazılırlar. Ürün kodu
    # olmadıkları için biçimlendirilmeleri anlamsız; dahil bırakmak `ruff
    # format --check .`'i (CI'nın koştuğu komut) test koşumundan sonra
    # kimsenin yapmadığı bir değişiklik yüzünden kırıyordu.
    "work",
    # Oturum içi scratch (pytest geçici dizinleri) — gitignore'lu, ürün kodu
    # değil; içindeki pytest-* dizinleri Windows ACL'i yüzünden okunamayabiliyor
    # ve `ruff format --check .` yalnız bu yüzden exit 2 veriyordu.
    ".tmp",
]

[tool.ruff.lint]
# Pragmatic first-adoption set: pyflakes (real bugs), import order, whitespace,
# and safe pyupgrade modernizations. Line length is owned by `ruff format`
# (E501 off), and E402 is off because the app deliberately uses module-level
# setup (UTF-8 reconfigure) and lazy imports to defer the heavy nautilus load.
# `B` (flake8-bugbear) is a worthwhile future tightening once its backlog is triaged.
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# e2e: canlı ağ çağrısı yapan (örn. Bybit'ten gerçek bar indiren), dakikalar
# sürebilen testler — varsayılan koşumdan hariç, açıkça `-m e2e` ile çalıştırılır.
markers = [
    "e2e: hits a live external API and can take minutes; run explicitly with -m e2e",
    # browser: gerçek Chromium açar (Playwright). Şablonlara gömülü inline JS —
    # sihirbaz adım kilitleri, mod geçişi, canlı düğüm taşıma, mcSyncRange —
    # `TestClient` ile erişilemez; tek yolu tarayıcı. Varsayılan koşumda
    # DESELECT edilir (skip DEĞİL: biri kasıt, öbürü kaza) ve CI'da kendi
    # adımında koşar. Yerelde: `playwright install chromium && pytest -m browser`.
    "browser: drives a real Chromium via Playwright; run explicitly with -m browser",
]
# `-ra`: DeepR 2026-08-11 [YÜKSEK] — atlanan testler SESSİZ olmasın. Ortama
# bağlı skip'ler (dış katalog yoksa test_sandbox.TestExternalRecipe gibi)
# özet satırında yalnız bir sayı olarak görünüyordu; gerekçesi hiçbir yere
# basılmadığı için "1 skipped" kimsenin bakmadığı bir rakamdı. `-ra` her
# skip/xfail'in SEBEBİNİ dosya:satır ile birlikte kısa özete yazar, yani
# "hangi kritik akış bu makinede/CI'da sınanmadı" sorusu tek bakışta cevaplanır.
addopts = "-m \"not e2e and not browser\" -ra"
# Üçüncü-parti deprecation gürültüsünü sustur (ikisi de bizim kodumuzda değil,
# `grep utcnow` → 0; yükseltme dışında düzeltilemez) — gerçek sinyal görünür kalsın.
#   - Timestamp.utcnow: nautilus_trader 1.230 engine.run() içinden
#   - httpx/starlette testclient: fastapi TestClient importunda sürüm-el sıkışması
filterwarnings = [
    "ignore:.*Timestamp\\.utcnow.*:DeprecationWarning",
    "ignore:.*utcnow\\(\\) is deprecated.*",
    "ignore:.*httpx.*starlette\\.testclient.*",
    "ignore:.*Using `httpx`.*:DeprecationWarning",
]

# Bağımlılık kilidi (DeepR 2026-08-11 [YÜKSEK])
# ---------------------------------------------
# Soyut alt sınırlar [project]'te durur; TAM sürümler `uv.lock`'ta — ve uv.lock
# artık depoya işlenmiştir. Kilit, bu süitin YEŞİL olduğu kurulu ortamdan
# üretildi (98 paketin tamamı geliştirme makinesindeki sürümlerle birebir), yani
# CI ile yerel makine aynı pandas/numpy/pyarrow'u koşar — bir backtest
# laboratuvarında Sharpe/drawdown tekrar-üretilebilirliği (regression_baseline.json)
# doğrudan buna bağlı.
#
#   Kurulum : uv sync --locked --extra dev     (CI aynı komutu koşar)
#             pip install -e ".[dev]"          (kilidi OKUMAZ; yalnız yerel kolaylık)
#   Yükseltme: uv lock --upgrade-package <ad>  → uv.lock'u da commit'le
#
# `uv sync --locked` kilit pyproject'ten SAPMIŞSA hata verir: yeni bir bağımlılık
# `uv lock` koşulmadan eklenirse CI sessizce en yenisini çözmek yerine kırılır.

# Kapsam (coverage) — kapı ÖLÇÜMDEN kondu, sezgiden değil
# ------------------------------------------------------
# Ölçüldü 2026-08-17, tam süit (2.431 test): uygulama kodunda %79 satır kapsamı
# (`tests/` hariç; tests dahil edilirse %89 çıkıyor ve o sayı kendi kendini
# överdi). Kapı 75'e konuldu: anlamlı bir düşüşü yakalar, rutin işi bloklamaz.
# Yükseltmek isteyen önce ölçümü yenilesin — bu depoda eşiklerin gözlemden
# konması yerleşik bir kural.
#
# `fail_under` BURADA, CI komut satırında değil: yerel `pytest --cov` de aynı
# kapıyı görsün, "CI'da kırmızı ama bende yeşil" olmasın.
[tool.coverage.run]
branch = false
omit = [
    "tests/*",
    "legacy/*",
    "scripts/*",
    ".venv/*",
    "*/site-packages/*",
    # Tek seferlik/elle koşulan araçlar: süit onları çağırmaz ve çağırmamalı.
    "capture_baseline.py",
    "compact_sessions.py",
]

[tool.coverage.report]
fail_under = 75
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
