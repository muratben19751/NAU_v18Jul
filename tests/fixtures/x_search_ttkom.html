<!doctype html>
<!--
  `x_watch.parse_tweets` için sabit girdi: x.com/search?q=ttkom&f=live sayfasının
  BUDANMIŞ bir kopyası. Gerçek sayfanın React ağacı çok daha derin; burada
  yalnızca parser'ın dayandığı sözleşme korunur ve gerçek sayfanın parser'ı
  zorlayan özellikleri BİLEREK içeridedir:

    • 1. kart: emoji `<img alt>` + `<br>` + iç içe `<span>` içeren metin
    • 2. kart: ALINTILI tweet — iç içe `<article>` ve İKİNCİ bir /status/ linki
      (kartın kimliği DIŞTAKİ ilk linkten gelmeli, alıntınınkinden değil)
    • 3. kart: tweetText'ten ÖNCE gelen ek /status/ linkleri (zaman damgası
      bağlantısı), yani "ilk eşleşen link kazanır" kuralı sınanır
    • 4. kart: metinsiz (yalnız görsel) tweet — id var, text yok
    • Sonda: article olmayan, /status/ içeren bir "kim takip edilmeli" bloğu
      (parser bunu tweet sanmamalı)
-->
<html lang="tr">
<head><title>ttkom - Arama / X</title></head>
<body>
<div id="react-root">
<main role="main">
<div aria-label="Zaman Akışı: Ara">

      <div data-testid="User-Name">
        <a href="/borsaci_ali" role="link"><span>Ali Yatırım</span></a>

        <span>hedef 52.30</span>

    </article>
  </div>

  <div data-testid="cellInnerDiv">
    <article data-testid="tweet" tabindex="0" role="article">

      <div data-testid="tweetText" lang="tr" dir="auto">
        <span>Bu yorumu ttkom için önemli buldum</span>
      </div>
      <div role="link" tabindex="0">
        <article role="article">

          <div data-testid="tweetText" lang="tr" dir="auto"><span>alıntılanan eski analiz</span></div>
        </article>
      </div>
    </article>
  </div>

  <div data-testid="cellInnerDiv">
    <article data-testid="tweet" tabindex="0" role="article">
      <a href="/kap_bildirim/status/1822334455667700123" role="link" aria-label="bağlantı"></a>
      <div data-testid="User-Name">
        <a href="/kap_bildirim" role="link"><span>KAP Bildirim</span></a>
